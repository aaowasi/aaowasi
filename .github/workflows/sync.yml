name: Sync project catalogue
on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * *'
permissions:
  contents: write
concurrency:
  group: catalogue-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/sync_catalogue.py
      - run: python scripts/build_site.py
      - run: python scripts/check_site.py
      - name: Commit validated public catalogue
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/projects.json site
          if ! git diff --cached --quiet; then
            git commit -m 'Sync public project catalogue'
            git push
          fi
