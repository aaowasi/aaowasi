name: Verify production routes
on:
  push:
    paths:
      - scripts/check_deployment.py
      - .github/workflows/production.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_deployment.py
